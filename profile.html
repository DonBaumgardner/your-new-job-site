<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Your Professional Profile | Your New Job Site</title><meta name="description" content="Create and save a professional job-seeker profile."><link rel="canonical" href="https://yournewjobsite.com/profile.html"><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">Your New Job Site</a><div class="links"><a href="jobs.html">Search Jobs</a><a href="profile.html">Build Profile</a><a href="resume-helper.html">Resume Helper</a><a href="my-resumes.html">My Resumes</a><a href="saved-jobs.html">Saved Jobs</a><a href="applications.html">Applications</a><a class="primary" data-user href="signin.html">Sign In</a></div></nav></header><main id="main"><section class="section"><div class="wrap"><h1>Build Your Professional Profile</h1><p class="muted">Your information is saved in this browser on this device.</p><form id="profileForm" class="card"><div class="two"><div class="field"><label for="name">Full name</label><input id="name" required></div><div class="field"><label for="headline">Professional headline</label><input id="headline" placeholder="Customer Service Specialist"></div></div><div class="two"><div class="field"><label for="email">Email</label><input id="email" type="email"></div><div class="field"><label for="phone">Phone</label><input id="phone" type="tel"></div></div><div class="field"><label for="location">City and state</label><input id="location"></div><div class="field"><label for="summary">Professional summary</label><textarea id="summary"></textarea></div><div class="field"><label for="skills">Skills, separated by commas</label><input id="skills"></div><button class="button primary" type="submit">Save Profile</button><span id="msg" aria-live="polite"></span></form></div></section></main><footer><div class="footer"><div><strong>Your New Job Site</strong><br><span>Move your career forward.</span></div><div><a href="about.html">About</a> · <a href="privacy.html">Privacy</a> · <a href="employers.html">Employers</a><br>© <span data-year></span> Your New Job Site</div></div></footer><script src="app.js"></script><script>const f=document.getElementById('profileForm'),p=STORE.get('ynjs_profile',{});for(const k of ['name','headline','email','phone','location','summary','skills'])if(p[k])document.getElementById(k).value=p[k];f.addEventListener('submit',e=>{e.preventDefault();const o={};for(const k of ['name','headline','email','phone','location','summary','skills'])o[k]=document.getElementById(k).value.trim();STORE.set('ynjs_profile',o);document.getElementById('msg').textContent=' Profile saved.'});</script></body></html>
