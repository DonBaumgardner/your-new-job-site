<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Jobs | Your New Job Site</title><meta name="description" content="Review jobs saved during your job search."><link rel="canonical" href="https://yournewjobsite.com/saved-jobs.html"><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">Your New Job Site</a><div class="links"><a href="jobs.html">Search Jobs</a><a href="profile.html">Build Profile</a><a href="resume-helper.html">Resume Helper</a><a href="my-resumes.html">My Resumes</a><a href="saved-jobs.html">Saved Jobs</a><a href="applications.html">Applications</a><a class="primary" data-user href="signin.html">Sign In</a></div></nav></header><main id="main"><section class="section"><div class="wrap"><h1>Saved Jobs</h1><div id="saved" class="grid"></div></div></section></main><footer><div class="footer"><div><strong>Your New Job Site</strong><br><span>Move your career forward.</span></div><div><a href="about.html">About</a> · <a href="privacy.html">Privacy</a> · <a href="employers.html">Employers</a><br>© <span data-year></span> Your New Job Site</div></div></footer><script src="app.js"></script><script>function draw(){const a=STORE.get('ynjs_saved_jobs',[]);document.getElementById('saved').innerHTML=a.length?a.map(j=>`<article class="card"><h2>${esc(j.title)}</h2><p>${esc(j.company)} · ${esc(j.location)}</p><button class="button danger" onclick="removeJ('${j.id}')">Remove</button></article>`).join(''):'<div class="card empty">No saved jobs yet. <a href="jobs.html">Search jobs</a>.</div>'}function removeJ(id){STORE.set('ynjs_saved_jobs',STORE.get('ynjs_saved_jobs',[]).filter(x=>x.id!==id));draw()}draw()</script></body></html>
