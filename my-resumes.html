<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Saved Resumes | Your New Job Site</title><meta name="description" content="Create and manage resumes saved with Your New Job Site."><link rel="canonical" href="https://yournewjobsite.com/my-resumes.html"><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">Your New Job Site</a><div class="links"><a href="jobs.html">Search Jobs</a><a href="profile.html">Build Profile</a><a href="resume-helper.html">Resume Helper</a><a href="my-resumes.html">My Resumes</a><a href="saved-jobs.html">Saved Jobs</a><a href="applications.html">Applications</a><a class="primary" data-user href="signin.html">Sign In</a></div></nav></header><main id="main"><section class="section"><div class="wrap"><h1>My Resumes</h1><p class="muted">Saved in this browser on this device.</p><div class="actions"><a class="button primary" href="resume-builder.html">Create New Resume</a></div><div id="list" class="card"></div></div></section></main><footer><div class="footer"><div><strong>Your New Job Site</strong><br><span>Move your career forward.</span></div><div><a href="about.html">About</a> · <a href="privacy.html">Privacy</a> · <a href="employers.html">Employers</a><br>© <span data-year></span> Your New Job Site</div></div></footer><script src="app.js"></script><script>function draw(){const a=STORE.get('ynjs_resumes',[]),l=document.getElementById('list');l.innerHTML=a.length?a.map(x=>`<div class="item"><h2>${esc(x.rtitle||'Untitled Resume')}</h2><p>Updated ${esc(x.updated||'')}</p><div class="toolbar"><button class="button secondary" onclick="editR('${x.id}')">Edit</button><button class="button danger" onclick="delR('${x.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No saved resumes yet.</div>'}function editR(id){localStorage.setItem('ynjs_edit_resume',id);location.href='resume-edit.html'}function delR(id){if(confirm('Delete this resume?')){STORE.set('ynjs_resumes',STORE.get('ynjs_resumes',[]).filter(x=>x.id!==id));draw()}}draw();</script></body></html>
