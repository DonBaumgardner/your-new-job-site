<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications | Your New Job Site</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}.topbar{background:#fff;border-bottom:1px solid #dbe3ee;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:24px;font-weight:700;color:#1264d8}.btn{display:inline-block;border:0;background:#1264d8;color:#fff;text-decoration:none;padding:11px 17px;border-radius:8px;font-weight:700;cursor:pointer}.btn:hover{background:#0d4fae}.hero{background:linear-gradient(135deg,#1059c7,#1685df);color:#fff;padding:38px 28px}.hero-inner,.container{max-width:1100px;margin:auto}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;line-height:1.5}.container{padding:28px 18px 42px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;background:#fff;padding:16px;border:1px solid #dfe6ef;border-radius:12px;margin-bottom:20px}.toolbar input,.toolbar select{flex:1;min-width:180px;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.05)}.row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.card h2{font-size:19px;margin:0 0 6px}.meta{color:#64748b;font-size:14px;line-height:1.55}.status{padding:7px 11px;border-radius:20px;background:#eaf2ff;color:#1264d8;font-size:13px;font-weight:700}.empty{text-align:center;color:#64748b;padding:36px 12px}.note{margin-top:18px;color:#64748b;font-size:13px}footer{text-align:center;color:#64748b;padding:22px}@media(max-width:600px){.topbar,.hero{padding-left:18px;padding-right:18px}.hero h1{font-size:27px}.btn{width:100%;text-align:center}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">Your New Job Site</div><a class="btn" href="job-seeker-dashboard.html">Job Seeker Dashboard</a></header>
<section class="hero"><div class="hero-inner"><h1>My Applications</h1><p>Keep your job applications organized and track each application from one place.</p></div></section>
<main class="container">
<div class="toolbar"><input id="search" type="search" placeholder="Search applications"><select id="filter"><option value="all">All statuses</option><option value="applied">Applied</option><option value="review">Under Review</option><option value="interview">Interview</option><option value="closed">Closed</option></select></div>
<div id="applications"></div>
<p class="note">Applications saved by connected pages can appear here when they use the browser key <strong>ynjsApplications</strong>.</p>
</main>
<footer>Your New Job Site • Job Seeker Center</footer>
<script>
const list=document.getElementById('applications'), search=document.getElementById('search'), filter=document.getElementById('filter');
function load(){try{return JSON.parse(localStorage.getItem('ynjsApplications')||'[]')}catch(e){return[]}}
function render(){const q=search.value.trim().toLowerCase(),f=filter.value;const apps=load().filter(a=>{const text=((a.jobTitle||'')+' '+(a.company||'')+' '+(a.location||'')).toLowerCase();const s=(a.status||'Applied').toLowerCase().replace(/\s+/g,'');return text.includes(q)&&(f==='all'||s===f.toLowerCase().replace(/\s+/g,''));});if(!apps.length){list.innerHTML='<div class="card empty"><h2>No matching applications yet</h2><p>When you apply for jobs, they can be listed here for tracking.</p><a class="btn" href="job-search.html">Search Jobs</a></div>';return}list.innerHTML=apps.map(a=>'<article class="card"><div class="row"><div><h2>'+esc(a.jobTitle||'Job Application')+'</h2><div class="meta">'+esc(a.company||'Company not listed')+(a.location?' • '+esc(a.location):'')+(a.appliedDate?'<br>Applied: '+esc(a.appliedDate):'')+'</div></div><div class="status">'+esc(a.status||'Applied')+'</div></div></article>').join('')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
search.addEventListener('input',render);filter.addEventListener('change',render);render();
</script>
</body>
</html>
