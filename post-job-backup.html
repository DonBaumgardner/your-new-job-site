<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a Job | Your New Job Site</title><meta name="description" content="Create and save a professional job listing draft."><link rel="canonical" href="https://yournewjobsite.com/post-job.html"><link rel="stylesheet" href="styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><nav class="nav" aria-label="Main navigation"><a class="brand" href="index.html">Your New Job Site</a><div class="links"><a href="jobs.html">Search Jobs</a><a href="profile.html">Build Profile</a><a href="resume-helper.html">Resume Helper</a><a href="my-resumes.html">My Resumes</a><a href="saved-jobs.html">Saved Jobs</a><a href="applications.html">Applications</a><a class="primary" data-user href="signin.html">Sign In</a></div></nav></header><main id="main"><section class="section"><div class="wrap"><h1>Post a Job</h1><form id="post" class="card"><div class="two"><div class="field"><label for="title">Job title</label><input id="title" required></div><div class="field"><label for="company">Company</label><input id="company" required></div></div><div class="two"><div class="field"><label for="location">Location</label><input id="location" required></div><div class="field"><label for="type">Employment type</label><select id="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option></select></div></div><div class="field"><label for="description">Job description</label><textarea id="description" required></textarea></div><button class="button primary">Save Draft</button><div id="msg" aria-live="polite"></div></form></div></section></main><footer><div class="footer"><div><strong>Your New Job Site</strong><br><span>Move your career forward.</span></div><div><a href="about.html">About</a> · <a href="privacy.html">Privacy</a> · <a href="employers.html">Employers</a><br>© <span data-year></span> Your New Job Site</div></div></footer><script src="app.js"></script><script>document.getElementById('post').addEventListener('submit',e=>{e.preventDefault();const o={id:String(Date.now())};['title','company','location','type','description'].forEach(k=>o[k]=document.getElementById(k).value.trim());let a=STORE.get('ynjs_job_drafts',[]);a.unshift(o);STORE.set('ynjs_job_drafts',a);document.getElementById('msg').textContent='Draft saved in this browser.'})</script></body></html>
